modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"
issueTrackerURL = "https://github.com/HERRA-Team/herra-stamina/issues"
displayTest = "IGNORE_SERVER_VERSION"

[[mods]]
modId = "herra_stamina"
version = "1.0.2"
displayName = "HERRA Stamina"
authors = "HERRA Team"
logoFile = "herra_stamina_logo.png"
description = '''
Standalone tactical stamina system for the HERRA extraction-shooter modpack.
Sprint / jump / swim / attack / mining stamina costs, delayed regeneration
with a strict exhaustion lock (no sprint, no jump, walk only), low-stamina
sprint blocking, 4 HUD style presets, an in-game /sta settings screen
(drag-to-position, scale, skins, exhaustion heartbeat sound with volume
control) and a pixel-art animated stamina HUD built on LDLib2.
'''

[[dependencies.herra_stamina]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.216,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.herra_stamina]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

# LDLib2 - powers the ModularUI HUD layer
[[dependencies.herra_stamina]]
    modId = "ldlib2"
    type = "required"
    versionRange = "[2.2.1,)"
    ordering = "NONE"
    side = "BOTH"

# Client-side mixin: sprint blocking at the vanilla hunger-check point
[[mixins]]
config = "herra_stamina.mixins.json"
